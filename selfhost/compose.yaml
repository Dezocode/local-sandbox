services:
  local-sandbox:
    image: caddy:2.11.4@sha256:13ba145cba2f3e28fa801994876e4c086d1b95d5aa2a520a734765ffb6b12017
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LOCAL_SANDBOX_DOMAIN: ${LOCAL_SANDBOX_DOMAIN:?Set your own domain}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
