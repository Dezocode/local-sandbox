<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><title>Install Shortcuts · Local Sandbox</title></head><body><header><a href="index.html">‹ Workspace</a><span>Shortcut packages</span></header><main><h1>Install your Shortcut stack</h1><p>Each package opens Apple's Add Shortcut flow. Install dependencies first, then run a harmless device test. Downloading does not prove installation.</p><label>Import published catalog<input id="catalog-file" type="file" accept="application/json"></label><p id="message" role="status">Loading release catalog…</p><div id="packages"></div></main><script type="module">
import{parseCatalog,installOrder}from'./packages.js';
const message=document.getElementById('message'),list=document.getElementById('packages');
function render(value){const c=parseCatalog(value);list.replaceChildren();message.textContent=c.packages.length?'Package release '+c.release:'No signed packages published yet. Run the macOS package publisher with actual exported workflows; this screen never opens a blank editor.';for(const p of installOrder(c)){const box=document.createElement('section');box.className='card';const title=document.createElement('h2');title.textContent=p.name;const detail=document.createElement('p');detail.textContent='Host: '+new URL(p.url).host+' · '+p.bytes+' bytes\nSHA-256: '+p.sha256;detail.style.overflowWrap='anywhere';const a=document.createElement('a');a.textContent='Add Shortcut';a.href=p.url;a.rel='noreferrer';a.onclick=e=>{if(!confirm('Open the signed package from '+new URL(p.url).host+' in Apple Shortcuts?'))e.preventDefault()};box.append(title,detail,a);list.append(box)}}
fetch('../shortcuts/catalog.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('Catalog unavailable. Import the catalog exported by your publisher.');return r.json()}).then(render).catch(e=>message.textContent=e.message);
document.getElementById('catalog-file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>100000)throw Error('Catalog is too large.');render(JSON.parse(await f.text()))}catch(e){message.textContent=e.message}finally{e.target.value=''}};
</script></body></html>
