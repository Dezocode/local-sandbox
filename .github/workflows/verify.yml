name: Validate Local Sandbox
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: corepack enable
      - run: npm run install:ci
      - name: Install deterministic release artifact dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input 'pillow==12.3.0' 'reportlab==4.4.9' 'pypdf==6.10.0'
      - name: Run portable web contract suites
        run: node scripts/verify-release.mjs --portable-web-only
  native:
    runs-on: xcode-27
    steps:
      - name: Verify native CI toolchain
        shell: bash
        run: |
          set -euo pipefail
          LOCAL_SANDBOX_XCODE_OUTPUT=$(xcodebuild -version)
          printf '%s\n' "$LOCAL_SANDBOX_XCODE_OUTPUT"
          xcodebuild -showsdks
          LOCAL_SANDBOX_SWIFT_OUTPUT=$(xcrun swiftc --version)
          printf '%s\n' "$LOCAL_SANDBOX_SWIFT_OUTPUT"
          LOCAL_SANDBOX_IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          LOCAL_SANDBOX_SIMULATOR_SDK=$(xcrun --sdk iphonesimulator --show-sdk-version)
          printf 'Selected iOS SDK: %s\nSelected Simulator SDK: %s\n' "$LOCAL_SANDBOX_IOS_SDK" "$LOCAL_SANDBOX_SIMULATOR_SDK"
          python3 - "$LOCAL_SANDBOX_XCODE_OUTPUT" "$LOCAL_SANDBOX_SWIFT_OUTPUT" "$LOCAL_SANDBOX_IOS_SDK" "$LOCAL_SANDBOX_SIMULATOR_SDK" <<'PY'
          import re, sys
          xcode, swift, ios_sdk, simulator_sdk = sys.argv[1:]
          xcode_version = re.fullmatch(r"Xcode (\d+)(?:\.\d+){0,2}(?: beta \d+| RC)?\nBuild version [A-Za-z0-9]+", xcode)
          swift_version = re.search(r"(?:Apple )?Swift version (\d+)\.\d+", swift)
          if xcode_version is None or int(xcode_version[1]) < 27:
              raise SystemExit("Native CI requires Xcode 27 or later for the complete iOS 27 App Intents source.")
          if swift_version is None or int(swift_version[1]) < 6:
              raise SystemExit("Native CI requires a Swift 6 or later compiler.")
          for name, version in (("iOS", ios_sdk), ("Simulator", simulator_sdk)):
              match = re.fullmatch(r"(\d+)(?:\.\d+){0,2}", version)
              if match is None or int(match[1]) < 27:
                  raise SystemExit(f"Native CI requires a {name} SDK version of 27 or later.")
          print("Supplemental native CI toolchain accepted; exact-RC archive/upload qualification is separate.")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: corepack enable
      - name: Install deterministic dependencies
        run: npm run install:ci
      - name: Install deterministic release artifact dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input 'pillow==12.3.0' 'reportlab==4.4.9' 'pypdf==6.10.0'
      - name: Run canonical full verification
        env:
          LOCAL_SANDBOX_RELEASE_PYTHON: python3
        run: pnpm run verify
      - name: Show installed Apple toolchain
        run: xcodebuild -version && xcodebuild -showsdks
      - name: Compile native app
        run: xcodebuild -project ios/LocalSandbox.xcodeproj -scheme LocalSandbox -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/local-sandbox-native-derived" CODE_SIGNING_ALLOWED=NO build
      - name: Verify compiled App Shortcuts metadata
        run: python3 scripts/release/app_intents_metadata.py "$RUNNER_TEMP/local-sandbox-native-derived/Build/Products/Debug-iphonesimulator/LocalSandbox.app/Metadata.appintents/extract.actionsdata"
      - name: Run contract tests on an available iPhone simulator
        shell: bash
        run: |
          LOCAL_SANDBOX_SIMULATOR=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); rows=[v for k,a in d["devices"].items() if "iOS-26" in k or "iOS-27" in k for v in a if "iPhone" in v["name"]]; print(rows[0]["udid"] if rows else "")')
          test -n "$LOCAL_SANDBOX_SIMULATOR"
          python3 scripts/release/apple.py test --simulator "$LOCAL_SANDBOX_SIMULATOR"
