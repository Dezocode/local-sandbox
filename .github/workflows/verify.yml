name: Validate Local Sandbox
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: corepack enable
      - run: npm run install:ci
      - name: Install deterministic release artifact dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input 'pillow==12.3.0' 'reportlab==4.4.9' 'pypdf==6.10.0'
      - name: Run portable web contract suites
        run: node scripts/verify-release.mjs --portable-web-only
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: corepack enable
      - name: Install deterministic dependencies
        run: npm run install:ci
      - name: Install deterministic release artifact dependencies
        run: python3 -m pip install --disable-pip-version-check --no-input 'pillow==12.3.0' 'reportlab==4.4.9' 'pypdf==6.10.0'
      - name: Run canonical full verification
        env:
          LOCAL_SANDBOX_RELEASE_PYTHON: python3
        run: pnpm run verify
      - name: Show installed Apple toolchain
        run: xcodebuild -version && xcodebuild -showsdks
      - name: Compile native app
        run: xcodebuild -project ios/LocalSandbox.xcodeproj -scheme LocalSandbox -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run contract tests on an available iPhone simulator
        shell: bash
        run: |
          LOCAL_SANDBOX_SIMULATOR=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); rows=[v for k,a in d["devices"].items() if "iOS-26" in k or "iOS-27" in k for v in a if "iPhone" in v["name"]]; print(rows[0]["udid"] if rows else "")')
          test -n "$LOCAL_SANDBOX_SIMULATOR"
          xcodebuild -project ios/LocalSandbox.xcodeproj -scheme LocalSandbox -destination "platform=iOS Simulator,id=$LOCAL_SANDBOX_SIMULATOR" CODE_SIGNING_ALLOWED=NO test
